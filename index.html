<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vante Bestiarium — Uma enciclopédia interativa de monstros para RPG de mesa. Conheça as criaturas das trevas." />
  <meta property="og:title" content="Vante Bestiarium" />
  <meta property="og:description" content="Entre nas trevas. Conheça seus inimigos." />
  <meta property="og:type" content="website" />
  <title>Vante Bestiarium</title>
  <link rel="icon" href="FAVICON - Vante Bestiarium.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <a href="#grade-monstros" class="pular-link">Pular para os monstros</a>

  <header class="cabecalho" role="banner">
    <div class="cabecalho__inner">
      <span class="cabecalho__logo">Vante Bestiarium</span>
      <nav class="cabecalho__nav" aria-label="Navegação principal">
        <a href="#grade-monstros" class="cabecalho__link">Explorar</a>
        <a href="#rodape" class="cabecalho__link">Sobre</a>
      </nav>
    </div>
  </header>

  <main>

    <section id="hero" class="hero" aria-label="Apresentação">
      <canvas id="canvas-nevoa" aria-hidden="true"></canvas>
      <div class="hero__conteudo">
        <h1 class="hero__titulo">Vante Bestiarium</h1>
        <p class="hero__tagline">Entre nas trevas. Conheça seus inimigos.</p>
        <div role="search" class="hero__busca-wrapper">
          <label for="campo-busca" class="sr-only">Buscar monstros</label>
          <input
            type="search"
            id="campo-busca"
            class="hero__busca"
            placeholder="Buscar monstros..."
            aria-label="Buscar monstros"
            autocomplete="off"
          />
          <span class="hero__busca-icone" aria-hidden="true">⌕</span>
        </div>
      </div>
    </section>

    <section id="filtros" class="filtros" aria-label="Filtros">
      <div class="filtros__inner">
        <div class="filtros__grupo" role="group" aria-label="Filtrar por tipo">
          <span class="filtros__label">Tipo</span>
          <div class="filtros__pills">
            <button class="pill pill--ativo" data-filtro="tipo" data-valor="Todos" aria-pressed="true">Todos</button>
            <button class="pill" data-filtro="tipo" data-valor="Besta" aria-pressed="false">Besta</button>
            <button class="pill" data-filtro="tipo" data-valor="Morto-Vivo" aria-pressed="false">Morto-Vivo</button>
            <button class="pill" data-filtro="tipo" data-valor="Dragão" aria-pressed="false">Dragão</button>
            <button class="pill" data-filtro="tipo" data-valor="Humanoide" aria-pressed="false">Humanoide</button>
            <button class="pill" data-filtro="tipo" data-valor="Elemental" aria-pressed="false">Elemental</button>
            <button class="pill" data-filtro="tipo" data-valor="Demônio" aria-pressed="false">Demônio</button>
          </div>
        </div>
        <div class="filtros__grupo" role="group" aria-label="Filtrar por raridade">
          <span class="filtros__label">Raridade</span>
          <div class="filtros__pills">
            <button class="pill pill--ativo" data-filtro="raridade" data-valor="Todos" aria-pressed="true">Todos</button>
            <button class="pill pill--comum" data-filtro="raridade" data-valor="Comum" aria-pressed="false">Comum</button>
            <button class="pill pill--incomum" data-filtro="raridade" data-valor="Incomum" aria-pressed="false">Incomum</button>
            <button class="pill pill--raro" data-filtro="raridade" data-valor="Raro" aria-pressed="false">Raro</button>
            <button class="pill pill--epico" data-filtro="raridade" data-valor="Épico" aria-pressed="false">Épico</button>
            <button class="pill pill--lendario" data-filtro="raridade" data-valor="Lendário" aria-pressed="false">Lendário</button>
          </div>
        </div>
      </div>
      <div class="filtros__contagem" aria-live="polite" aria-atomic="true" id="contagem-resultados"></div>
    </section>

    <section id="grade-monstros" class="grade-section" aria-label="Lista de monstros">
      <div class="grade" role="list" id="grade">
      </div>
      <div class="grade__vazio" id="estado-vazio" hidden>
        <p>Nenhum monstro encontrado nas trevas.</p>
      </div>
    </section>

  </main>

  <div
    id="modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-nome"
    hidden
  >
    <div class="modal__backdrop" id="modal-backdrop"></div>
    <div class="modal__painel" role="document">
      <button class="modal__fechar" id="modal-fechar" aria-label="Fechar detalhes do monstro">×</button>

      <div class="modal__cabecalho">
        <div class="modal__meta">
          <span class="modal__tipo" id="modal-tipo"></span>
          <span class="modal__badge-raridade" id="modal-raridade"></span>
        </div>
        <h2 class="modal__nome" id="modal-nome"></h2>
      </div>

      <div class="modal__corpo">
        <div class="modal__secao modal__secao--lore">
          <p class="modal__lore" id="modal-lore"></p>
          <p class="modal__habitat"><em id="modal-habitat"></em></p>
        </div>

        <div class="modal__secao modal__secao--stats">
          <h3 class="modal__secao-titulo">Atributos</h3>
          <div class="modal__stats-grid" id="modal-stats">
          </div>
          <div class="modal__combate" id="modal-combate">
          </div>
        </div>

        <div class="modal__secao modal__secao--habilidades">
          <h3 class="modal__secao-titulo">Habilidades</h3>
          <ul class="modal__habilidades" id="modal-habilidades" aria-label="Habilidades do monstro">
          </ul>
        </div>
      </div>
    </div>
  </div>

  <footer id="rodape" class="rodape" role="contentinfo">
    <div class="rodape__inner">
      <p class="rodape__texto">Vante Bestiarium · Um tomo digital para os que ousam.</p>
      <p class="rodape__credito">Forjado nas trevas.</p>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
